name: Build and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^APP_VERSION_NAME=//p' gradle.properties | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta[.-][0-9]+)?$ ]]
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            test -f "docs/releases/$version.md"
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-java@v4
        if: steps.version.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.build == 'true'
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.build == 'true'
      - name: Install Android SDK
        if: steps.version.outputs.build == 'true'
        run: android --no-metrics --sdk="$ANDROID_HOME" sdk install 'platforms/android-37.0' 'build-tools/37.0.0'
      - name: Restore fork signing key
        if: steps.version.outputs.build == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ENCODED_KEYSTORE" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/locationspoofer.p12"
          chmod 600 "$RUNNER_TEMP/locationspoofer.p12"
      - name: Test and build both schemes
        if: steps.version.outputs.build == 'true'
        env:
          KEYSTORE_FILE_PATH: ${{ runner.temp }}/locationspoofer.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :core-geo:test :core-data:testScopedDebugUnitTest :core-data:testGlobalDebugUnitTest :app-ui:testScopedDebugUnitTest :app-ui:testGlobalDebugUnitTest :xposed:testScopedDebugUnitTest :xposed:testGlobalDebugUnitTest
          ./gradlew --no-daemon --max-workers=2 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:assembleScopedRelease
          ./gradlew --no-daemon --max-workers=2 -Porg.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64 :app:assembleGlobalRelease
      - name: Verify and collect APKs
        if: steps.version.outputs.build == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir dist
          expected=$(tr -d '\r\n' < release-signing-certificate.sha256)
          for scheme in scoped global; do
            for abi in arm64-v8a armeabi-v7a; do
              mapfile -d '' apks < <(find "app/build/outputs/apk/$scheme/release" -name "*${abi}*.apk" -print0)
              test "${#apks[@]}" -eq 1
              "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apks[0]}"
              actual=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "${apks[0]}" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
              test "$actual" = "$expected"
              cp "${apks[0]}" "dist/LocationSpoofer-$scheme-$abi-$TAG.apk"
            done
          done
          (cd dist && sha256sum *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true'
        with:
          name: LocationSpoofer-${{ steps.version.outputs.tag }}
          path: dist/
      - name: Publish release
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          args=()
          [[ "$VERSION" != *-beta* ]] || args+=(--prerelease)
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "LocationSpoofer Fork $VERSION" --notes-file "docs/releases/$VERSION.md" "${args[@]}"
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/locationspoofer.p12"
